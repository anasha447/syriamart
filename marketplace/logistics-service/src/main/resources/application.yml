server:
  port: 8083

spring:
  application:
    name: logistics-service


  datasource:
    url: jdbc:postgresql://localhost:5432/logistics_db
    username: syriamart_admin
    password: password123
    driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true

# ── JWT — MUST match user-service and commercial-service ─────────────────────
jwt:
  secret: YourSuperSecretKeyMustBeSharedBetweenServices!!
  expiration-ms: 86400000      # 24 h

# ── Business config ───────────────────────────────────────────────────────────
logistics:
  delivery:
    rate-per-delivery-syp: 1500          # Driver earnings per completed delivery
    free-shipping-threshold-syp: 50000   # Mirror of commercial-service rule
    nearby-driver-radius-degrees: 0.05   # ~5 km bounding box for dispatch lookup

logging:
  level:
    com.syriamart: INFO
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health, info

        eureka:
          client:
            service-url:
              # This is the address of the Phonebook we just started!
              defaultZone: http://localhost:8761/eureka/
          instance:
            # This tells Eureka to use the service's IP address rather than the host name
            prefer-ip-address: true
